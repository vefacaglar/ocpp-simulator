# Mosquitto configuration for the local OCPP simulator v4.3
# stack. Only anonymous local connections are allowed; this
# broker is for development use and must not be exposed to the
# public network.
#
# Topics in use:
#   ocpp/+/in     raw OCPP-J frames from charge points
#   ocpp/+/out    raw OCPP-J frames to charge points
#   realtime/+/event  UI-facing runtime events (future)
#
# No payload transformation: messages are relayed as raw bytes.
# No ACL: every client can read and write every topic. Tighten
# this before any non-local deployment.

listener 1883
protocol mqtt

# Allow anonymous local connections. The compose network is
# trusted; production deployments must set up auth.
allow_anonymous true

# Default QoS 0, retain off. Topics are short-lived streams; we
# do not need durable sessions for the simulator.
max_qos 0
max_inflight_messages 200
max_queued_messages 10000

# Logs go to stdout so `docker compose logs mqtt` shows traffic.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
