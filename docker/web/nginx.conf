# nginx config for the OCPP simulator web UI. The Vue SPA is
# served as static files; /ws is reverse-proxied to ocpp-gateway
# so the browser can use a same-origin OCPP WebSocket URL.
#
#   /ws   →  ocpp-gateway   (per-charge-point OCPP WebSocket)
#   /     →  this image     (Vue dist)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode: send unknown paths to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ocpp-gateway: per-CP OCPP WebSocket at /ws/{chargePointId}.
    location /ws/ {
        proxy_pass http://ocpp-gateway:7080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # OCPP-J frames can be long-lived; the upstream gateway
        # has its own ping/pong and timeout handling.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Tiny cache hint for Vite-emitted static assets.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
